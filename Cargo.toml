[package]
name = "symbios-texture"
version = "0.3.0"
edition = "2024"
authors = ["Janus"]
description = "Procedural texture generation core for bevy_symbios_texture."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-texture"
keywords = ["texture", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

[dependencies]
noise = "0.9"
rand = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive", "rc"] }
symbios-genetics = "0.2"

[dev-dependencies]
serde_json = "1.0"
