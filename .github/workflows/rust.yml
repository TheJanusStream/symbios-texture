name: Rust

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Reads rust-toolchain.toml, so the runner compiles with the same rustc
      # the local gate does. Without this step the runner used whatever was
      # newest and `-D warnings` could go red on a lint that does not exist
      # locally.
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown
          cache: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Clippy (Linting)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run Tests
        run: cargo test --verbose

      # Green once symbios-genetics 0.2.2 is on the registry (its rand no
      # longer carries os_rng); until then getrandom fails to build for wasm.
      - name: Check wasm32 (lib)
        run: cargo check --target wasm32-unknown-unknown --lib
